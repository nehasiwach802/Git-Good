[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gitgood-reasoning"
version = "0.1.0"
requires-python = ">=3.11"
description = "Evidence-linked electronics lab reasoning core"

[project.optional-dependencies]
test = ["jsonschema>=4.18,<5"]
backend = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.20,<1", "Pillow>=11,<13", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["reasoning*", "labvision*", "backend*"]
