[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gitgood-reasoning"
version = "0.1.0"
requires-python = ">=3.11"
description = "Evidence-linked electronics lab reasoning core"

[project.optional-dependencies]
test = ["jsonschema>=4.18,<5", "numpy>=2,<3"]
backend = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.20,<1", "Pillow>=11,<13", "httpx>=0.28,<1", "firebase-admin>=6.5,<8", "mcp>=1.28,<2"]

[tool.setuptools.package-data]
backend = ["catalog.json"]

[tool.setuptools]
py-modules = ["lab_memory", "meko_transport", "mentor", "ml3_service", "knowledge_lifecycle", "outcome_writer", "equipment_flags", "qwen_transport"]

[tool.setuptools.packages.find]
include = ["reasoning*", "labvision*", "backend*"]
