[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gitgood-reasoning"
version = "0.1.0"
requires-python = ">=3.11"
description = "Evidence-linked electronics lab reasoning core"

[project.optional-dependencies]
test = ["jsonschema>=4.18,<5", "Pillow>=11,<13", "numpy>=2,<3", "opencv-python-headless>=4.10,<6"]
media = ["Pillow>=11,<13", "numpy>=2,<3", "opencv-python-headless>=4.10,<6"]

[tool.setuptools.packages.find]
include = ["reasoning*", "labvision*"]
